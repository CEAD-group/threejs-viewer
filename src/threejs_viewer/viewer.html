<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; }

        /* Top toolbar */
        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(30, 30, 30, 0.85);
            padding: 4px 6px;
            border-radius: 6px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cc3333;
            margin: 0 4px;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #status-dot.connected { background: #33cc33; }
        #status-dot.disconnected { background: #cc3333; }
        #status-text {
            color: #999;
            font-family: monospace;
            font-size: 11px;
            margin-right: 4px;
        }
        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: #555;
            margin: 0 2px;
        }
        .toolbar-btn {
            background: none;
            border: none;
            color: #aaa;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .toolbar-btn.active { background: #0066cc; color: white; }

        /* Animation Controls */
        #animation-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            padding: 12px 20px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        #animation-controls.visible { display: flex; }

        .timeline-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transport-buttons {
            display: flex;
            gap: 4px;
        }
        .transport-buttons button {
            background: #444;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transport-buttons button:hover { background: #555; }
        .transport-buttons button:active { background: #333; }
        .transport-buttons button.active { background: #0066cc; }

        #timeline-container {
            flex: 1;
            position: relative;
            height: 24px;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
        }
        #timeline-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #0066cc;
            border-radius: 4px 0 0 4px;
            pointer-events: none;
        }
        #timeline-markers {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .timeline-marker {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ff6600;
            pointer-events: auto;
            cursor: pointer;
        }
        /* Invisible wide hit area */
        .timeline-marker::before {
            content: '';
            position: absolute;
            top: 0;
            left: -8px;
            width: 18px;
            height: 100%;
        }
        .timeline-marker::after {
            content: attr(data-label);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #ff6600;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #timeline-container:hover .timeline-marker::after { opacity: 1; }
        .timeline-marker:hover { background: #ffaa00; box-shadow: 0 0 6px #ffaa0088; }

        .time-display {
            font-family: monospace;
            font-size: 13px;
            min-width: 120px;
            text-align: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .speed-control button {
            background: #444;
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .speed-control button:hover { background: #555; }
        .speed-control span {
            font-family: monospace;
            font-size: 12px;
            min-width: 50px;
            text-align: center;
        }

        .loop-toggle {
            background: #444;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .loop-toggle:hover { background: #555; }
        .loop-toggle.active { background: #0066cc; }

        .frame-display {
            font-family: monospace;
            font-size: 11px;
            color: #aaa;
            min-width: 100px;
        }

        .keyboard-hint {
            font-size: 10px;
            color: #666;
            text-align: center;
        }

        /* Clipping Plane Controls */
        #clipping-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            flex-direction: column;
            gap: 10px;
            min-width: 220px;
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #clipping-panel.visible { display: flex; }
        #clipping-panel h3 {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #clipping-panel h3 button {
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }
        #clipping-panel h3 button:hover { color: white; }
        .clip-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .clip-section label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .clip-axis-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .clip-axis-buttons button {
            background: #444;
            border: none;
            color: white;
            padding: 6px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .clip-axis-buttons button:hover { background: #555; }
        .clip-axis-buttons button.active { background: #0066cc; }
        .clip-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .clip-slider-row input[type="range"] {
            flex: 1;
            accent-color: #0066cc;
        }
        .clip-slider-row .clip-value {
            font-family: monospace;
            font-size: 12px;
            min-width: 52px;
            text-align: right;
        }
        .clip-toggle-row {
            display: flex;
            gap: 4px;
        }
        .clip-toggle-row button {
            flex: 1;
            background: #444;
            border: none;
            color: white;
            padding: 6px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .clip-toggle-row button:hover { background: #555; }
        .clip-toggle-row button.active { background: #0066cc; }
        .clip-normal-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .clip-normal-row label {
            font-size: 11px;
            color: #888;
            min-width: 14px;
            text-transform: none;
            margin: 0;
        }
        .clip-normal-row input {
            flex: 1;
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 4px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            width: 0;
        }
        .clip-normal-row input:focus {
            border-color: #0066cc;
            outline: none;
        }
        .clip-key-hint {
            font-size: 10px;
            color: #888;
            margin-left: 4px;
        }
        .clip-hint {
            font-size: 10px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div id="status-dot" class="disconnected" title="Disconnected"></div>
        <span id="status-text">Disconnected</span>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" id="btn-clip" title="Clipping Plane (C)">✂</button>
        <button class="toolbar-btn" id="btn-ortho" title="Orthographic / Perspective (O)">P</button>
    </div>

    <div id="clipping-panel">
        <h3>Clipping Plane <button id="clip-close" title="Close (C)">×</button></h3>
        <div class="clip-section">
            <label>Axis</label>
            <div class="clip-axis-buttons">
                <button data-axis="x+" class="active">X+</button>
                <button data-axis="y+">Y+</button>
                <button data-axis="z+">Z+</button>
                <button data-axis="x-">X−</button>
                <button data-axis="y-">Y−</button>
                <button data-axis="z-">Z−</button>
            </div>
        </div>
        <div class="clip-section">
            <label>Normal</label>
            <div class="clip-normal-row">
                <label>x</label><input type="number" id="clip-nx" step="0.01" value="1">
                <label>y</label><input type="number" id="clip-ny" step="0.01" value="0">
                <label>z</label><input type="number" id="clip-nz" step="0.01" value="0">
            </div>
        </div>
        <div class="clip-section">
            <label>Mode</label>
            <div class="clip-toggle-row">
                <button id="clip-mode-single" class="active">Single</button>
                <button id="clip-mode-slab">Slab</button>
            </div>
        </div>
        <div class="clip-section">
            <label>Position <span class="clip-key-hint">←→</span></label>
            <div class="clip-slider-row">
                <input type="range" id="clip-distance" min="-10" max="10" step="0.01" value="0">
                <span class="clip-value" id="clip-distance-value">0.00</span>
            </div>
        </div>
        <div class="clip-section" id="clip-thickness-section" style="display: none;">
            <label>Thickness <span class="clip-key-hint">↑↓</span></label>
            <div class="clip-slider-row">
                <input type="range" id="clip-thickness" min="0.01" max="20" step="0.01" value="2">
                <span class="clip-value" id="clip-thickness-value">2.00</span>
            </div>
        </div>
        <div class="clip-hint">C: toggle | S: slab | V: view normal | H: helper | ←→: position | ↑↓: thickness</div>
    </div>

    <div id="animation-controls">
        <div class="timeline-row">
            <div class="transport-buttons">
                <button id="btn-start" title="Jump to start (Home)">⏮</button>
                <button id="btn-prev-frame" title="Previous frame (←)">◁</button>
                <button id="btn-play" title="Play/Pause (Space)">▶</button>
                <button id="btn-next-frame" title="Next frame (→)">▷</button>
                <button id="btn-end" title="Jump to end (End)">⏭</button>
            </div>
            <div id="timeline-container">
                <div id="timeline-progress"></div>
                <div id="timeline-markers"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0.00</span>s / <span id="total-time">0.00</span>s
            </div>
            <div class="speed-control">
                <button id="btn-slower" title="Slower (↓)">−</button>
                <span id="speed-display">1x</span>
                <button id="btn-faster" title="Faster (↑)">+</button>
            </div>
            <button id="btn-loop" class="loop-toggle active" title="Toggle loop (L)">⟳ Loop</button>
            <div class="frame-display">Frame <span id="current-frame">0</span>/<span id="total-frames">0</span></div>
        </div>
        <div class="keyboard-hint">Space: Play/Pause | ←→: Step frames | Shift+←→: Step 10 | Home/End: Jump | L: Loop | ↑↓: Speed</div>
    </div>

                        scene.environment = envMap;
                        // Higher intensity compensates for low-energy 64px cubemap; tuned with
                        // ambientLight=1.5 and toneMappingExposure=1.5 — adjust together
                        scene.environmentIntensity = 2.0;
                        // Rotate 90° around X to align cubemap Y-up with scene Z-up
                        scene.environmentRotation = new THREE.Euler(Math.PI / 2, 0, 0);
                        cubeTexture.dispose();
                        pmremGenerator.dispose();
                    }
                };
                img.onerror = () => {
                    if (failed) return;
                    failed = true;
                    console.error(`Failed to load cubemap face: ${face}`);
                    cubeTexture.dispose();
                    pmremGenerator.dispose();
                };
                img.src = 'data:image/jpeg;base64,' + cubemapData[face];
            });
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Axis triad (interactive ViewHelper in bottom-left corner)
        let viewHelper = new ViewHelper(camera, renderer.domElement);
        viewHelper.center = controls.target;
        renderer.domElement.addEventListener('click', (e) => {
            if (viewHelper.handleClick(e)) {
                controls.target.copy(viewHelper.center);
            }
        });

        const btnOrtho = document.getElementById('btn-ortho');

        function switchCamera(toOrtho) {
            if (toOrtho === isOrtho) return;
            const aspect = window.innerWidth / window.innerHeight;

            if (toOrtho) {
                // Compute zoom to match perspective view size
                const dist = perspCamera.position.distanceTo(controls.target);
                const halfHeight = dist * Math.tan(THREE.MathUtils.degToRad(perspCamera.fov / 2));
                orthoCamera.zoom = ORTHO_FRUSTUM / halfHeight;
                orthoCamera.left = -ORTHO_FRUSTUM * aspect;
                orthoCamera.right = ORTHO_FRUSTUM * aspect;
                orthoCamera.top = ORTHO_FRUSTUM;
                orthoCamera.bottom = -ORTHO_FRUSTUM;
                orthoCamera.position.copy(perspCamera.position);
                orthoCamera.quaternion.copy(perspCamera.quaternion);
                orthoCamera.updateProjectionMatrix();
                camera = orthoCamera;
            } else {
                // Compute distance to match ortho view size
                const halfHeight = ORTHO_FRUSTUM / orthoCamera.zoom;
                const dist = halfHeight / Math.tan(THREE.MathUtils.degToRad(perspCamera.fov / 2));
                const dir = orthoCamera.position.clone().sub(controls.target).normalize();
                perspCamera.position.copy(controls.target).addScaledVector(dir, dist);
                perspCamera.quaternion.copy(orthoCamera.quaternion);
                perspCamera.aspect = aspect;
                perspCamera.updateProjectionMatrix();
                camera = perspCamera;
            }

            isOrtho = toOrtho;
            controls.object = camera;
            clipGizmo.camera = camera;
            // Recreate ViewHelper with new camera
            viewHelper = new ViewHelper(camera, renderer.domElement);
            viewHelper.center = controls.target;
            // Update button
            btnOrtho.textContent = isOrtho ? 'O' : 'P';
            btnOrtho.classList.toggle('active', isOrtho);
        }

        btnOrtho.addEventListener('click', () => switchCamera(!isOrtho));

        // Lighting — ambient + environment only (tuned with environmentIntensity=2.0
        // and toneMappingExposure=1.5 — adjust all three together)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        // Grid helper on XY plane (Z-up)
        const gridHelper = new THREE.GridHelper(10, 10);
        gridHelper.rotation.x = Math.PI / 2;  // Rotate to XY plane
        scene.add(gridHelper);

        // ========== Clipping Plane ==========
        const clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
        const clipPlane2 = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
        let clipPlanes = [clipPlane];
        let clipEnabled = false;
        let clipHelperVisible = true;
        let clipAxis = 'x+';
        let clipSlabMode = false;
        let clipSlabThickness = 2.0;
        let clipPosition = 0;
        let clipDefaults = null;  // {normal, distance} applied on first toggle

        // Anchor object: its local +Z axis = plane normal, position = point on plane
        const clipAnchor = new THREE.Group();
        clipAnchor.visible = false;
        scene.add(clipAnchor);

        // Semi-transparent disc to visualize the plane
        const discGeo = new THREE.CircleGeometry(5, 48);
        const discMat = new THREE.MeshBasicMaterial({
            color: 0x00aaff,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const clipDisc = new THREE.Mesh(discGeo, discMat);
        clipAnchor.add(clipDisc);

        // Edge ring for visibility
        const ringGeo = new THREE.RingGeometry(4.95, 5, 48);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x00aaff,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const clipRing = new THREE.Mesh(ringGeo, ringMat);
        clipAnchor.add(clipRing);

        // Second disc + ring for slab mode
        const clipDisc2 = new THREE.Mesh(discGeo, discMat.clone());
        clipDisc2.visible = false;
        clipAnchor.add(clipDisc2);
        const clipRing2 = new THREE.Mesh(ringGeo, ringMat.clone());
        clipRing2.visible = false;
        clipAnchor.add(clipRing2);

        // TransformControls for rotating the plane
        const clipGizmo = new TransformControls(camera, renderer.domElement);
        clipGizmo.attach(clipAnchor);
        clipGizmo.setMode('rotate');
        clipGizmo.visible = false;
        clipGizmo.enabled = false;
        const clipGizmoHelper = clipGizmo.getHelper();
        clipGizmoHelper.visible = false;

        // Disable orbit while dragging gizmo
        clipGizmo.addEventListener('dragging-changed', (e) => {
