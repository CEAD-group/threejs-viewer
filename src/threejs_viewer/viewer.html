        // When the gizmo is dragged, derive clipPlane from anchor transform
        const _zAxis = new THREE.Vector3();
        const _localZ = new THREE.Vector3(0, 0, 1);
        let clipSyncFromGizmo = false;  // guard to prevent feedback loops
        clipGizmo.addEventListener('change', () => {
            if (!clipEnabled) return;
            clipSyncFromGizmo = true;
            // Local +Z in world space = plane normal
            clipAnchor.getWorldDirection(_zAxis);
            // Recompute position along new normal after rotation
            clipPosition = clipAnchor.position.dot(_zAxis);

            clipPlane.normal.copy(_zAxis);
            updatePlaneConstants();
            updateDiscPositions();
            // Sync UI
            clipDistanceSlider.value = clipPosition;
            clipDistanceValue.textContent = clipPosition.toFixed(2);
            // Clear axis highlight (now in free orientation)
            clipPanelEl.querySelectorAll('.clip-axis-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            clipAxis = null;
            syncNormalInputs();
            clipSyncFromGizmo = false;
        });

        const clipPanelEl = document.getElementById('clipping-panel');
        const clipDistanceSlider = document.getElementById('clip-distance');
        const clipDistanceValue = document.getElementById('clip-distance-value');
        const clipThicknessSlider = document.getElementById('clip-thickness');
        const clipThicknessValue = document.getElementById('clip-thickness-value');

        const CLIP_AXIS_NORMALS = {
            'x+': new THREE.Vector3(1, 0, 0),
            'x-': new THREE.Vector3(-1, 0, 0),
            'y+': new THREE.Vector3(0, 1, 0),
            'y-': new THREE.Vector3(0, -1, 0),
            'z+': new THREE.Vector3(0, 0, 1),
            'z-': new THREE.Vector3(0, 0, -1),
        };

        // Normal input elements
        const clipNxInput = document.getElementById('clip-nx');
        const clipNyInput = document.getElementById('clip-ny');
        const clipNzInput = document.getElementById('clip-nz');

        function syncNormalInputs() {
            clipNxInput.value = clipPlane.normal.x.toFixed(2);
            clipNyInput.value = clipPlane.normal.y.toFixed(2);
            clipNzInput.value = clipPlane.normal.z.toFixed(2);
        }

        // Sync anchor position/orientation from clipPlane state
        function syncAnchorFromPlane() {
            if (clipSyncFromGizmo) return;  // don't fight the gizmo
            const normal = clipPlane.normal;
            clipAnchor.position.copy(normal).multiplyScalar(clipPosition);
            clipAnchor.quaternion.setFromUnitVectors(_localZ, normal);
            updateDiscPositions();
        }

        function setClipAxis(axis) {
            clipAxis = axis;
            const normal = CLIP_AXIS_NORMALS[axis].clone();
            clipPlane.normal.copy(normal);
            updatePlaneConstants();
            syncAnchorFromPlane();
            syncNormalInputs();
            updateClipSliderRange();
            // Update active button
            clipPanelEl.querySelectorAll('.clip-axis-buttons button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.axis === axis);
            });
        }

        function setClipDistance(d) {
            clipPosition = d;
            updatePlaneConstants();
            clipDistanceSlider.value = d;
            clipDistanceValue.textContent = d.toFixed(2);
            syncAnchorFromPlane();
        }

        function updatePlaneConstants() {
            if (clipSlabMode) {
                const halfT = clipSlabThickness / 2;
                // Plane 1: keeps points above center - halfT
                clipPlane.constant = -(clipPosition - halfT);
                // Plane 2: opposite normal, keeps points below center + halfT
                clipPlane2.normal.copy(clipPlane.normal).negate();
                clipPlane2.constant = clipPosition + halfT;
            } else {
                clipPlane.constant = -clipPosition;
            }
        }

        function updateDiscPositions() {
            if (clipSlabMode) {
                const halfT = clipSlabThickness / 2;
                clipDisc.position.z = halfT;
                clipRing.position.z = halfT;
                clipDisc2.position.z = -halfT;
                clipRing2.position.z = -halfT;
                clipDisc2.visible = true;
                clipRing2.visible = true;
            } else {
                clipDisc.position.z = 0;
                clipRing.position.z = 0;
                clipDisc2.visible = false;
                clipRing2.visible = false;
            }
        }

        function setClipThickness(t) {
            clipSlabThickness = Math.max(0.01, Math.min(20, t));
            clipThicknessSlider.value = clipSlabThickness;
            clipThicknessValue.textContent = clipSlabThickness.toFixed(2);
            updatePlaneConstants();
            syncAnchorFromPlane();
        }

        function applyClipToObject(obj) {
            const planes = clipEnabled ? clipPlanes : [];
            obj.traverse(child => {
                if (!child.material) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const mat of mats) {
                    mat.clippingPlanes = planes;
                    mat.clipShadows = true;
                    if (clipEnabled) {
                        if (mat.userData.originalSide === undefined) mat.userData.originalSide = mat.side;
                        mat.side = THREE.DoubleSide;
                    } else if (mat.userData.originalSide !== undefined) {
                        mat.side = mat.userData.originalSide;
                        delete mat.userData.originalSide;
                    }
                    mat.needsUpdate = true;
                }
            });
        }

        function isClipHelper(child) {
            // Skip clip anchor and its children, and gizmo helper
            let node = child;
            while (node) {
                if (node === clipAnchor || node === clipGizmoHelper) return true;
                node = node.parent;
            }
            return false;
        }

        const _bbox = new THREE.Box3();
        const _bboxCenter = new THREE.Vector3();
        function updateClipSliderRange() {
            _bbox.makeEmpty();
            scene.traverse(child => {
                if (!child.geometry) return;
                if (isClipHelper(child)) return;
                if (child === gridHelper) return;
                child.updateWorldMatrix(true, false);
                const geo = child.geometry;
                if (!geo.boundingBox) geo.computeBoundingBox();
                _bbox.expandByObject(child);
            });
            if (_bbox.isEmpty()) return;
            // Project bbox corners onto clip normal to get min/max range
            const n = clipPlane.normal;
            const corners = [
                new THREE.Vector3(_bbox.min.x, _bbox.min.y, _bbox.min.z),
                new THREE.Vector3(_bbox.max.x, _bbox.min.y, _bbox.min.z),
                new THREE.Vector3(_bbox.min.x, _bbox.max.y, _bbox.min.z),
                new THREE.Vector3(_bbox.max.x, _bbox.max.y, _bbox.min.z),
                new THREE.Vector3(_bbox.min.x, _bbox.min.y, _bbox.max.z),
                new THREE.Vector3(_bbox.max.x, _bbox.min.y, _bbox.max.z),
                new THREE.Vector3(_bbox.min.x, _bbox.max.y, _bbox.max.z),
                new THREE.Vector3(_bbox.max.x, _bbox.max.y, _bbox.max.z),
            ];
            let lo = Infinity, hi = -Infinity;
            for (const c of corners) {
                const d = c.dot(n);
                if (d < lo) lo = d;
                if (d > hi) hi = d;
            }
            clipDistanceSlider.min = lo.toFixed(2);
            clipDistanceSlider.max = hi.toFixed(2);
            clipDistanceSlider.step = ((hi - lo) / 500).toFixed(4);
            // Thickness slider: max = scene extent along normal
            const extent = hi - lo;
            if (extent > 0) {
                clipThicknessSlider.max = extent.toFixed(2);
                clipThicknessSlider.step = (extent / 500).toFixed(4);
            }
        }

        function updateClipMaterials() {
            scene.traverse(child => {
                if (!child.material) return;
                if (isClipHelper(child)) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const mat of mats) {
                    mat.clippingPlanes = clipEnabled ? clipPlanes : [];
                    mat.clipShadows = true;
                    if (clipEnabled) {
                        if (mat.userData.originalSide === undefined) mat.userData.originalSide = mat.side;
                        mat.side = THREE.DoubleSide;
                    } else if (mat.userData.originalSide !== undefined) {
                        mat.side = mat.userData.originalSide;
                        delete mat.userData.originalSide;
                    }
                    mat.needsUpdate = true;
                }
            });
            // Show/hide clip visuals
            clipAnchor.visible = clipEnabled && clipHelperVisible;
            const showGizmo = clipEnabled && clipHelperVisible;
            clipGizmo.visible = showGizmo;
            clipGizmo.enabled = showGizmo;
            clipGizmoHelper.visible = showGizmo;
        }

        const btnClip = document.getElementById('btn-clip');

        function toggleClipPanel() {
            clipEnabled = !clipEnabled;
            if (clipEnabled && clipDefaults) {
                const d = clipDefaults;
                clipDefaults = null;
                if (d.normal) {
                    clipPlane.normal.fromArray(d.normal).normalize();
                    syncNormalInputs();
                    // Match to axis button if it's a standard axis
                    let matched = null;
                    for (const [axis, n] of Object.entries(CLIP_AXIS_NORMALS)) {
                        if (n.equals(clipPlane.normal)) { matched = axis; break; }
                    }
                    if (matched) setClipAxis(matched);
                }
                if (d.distance != null) setClipDistance(d.distance);
            }
            clipPanelEl.classList.toggle('visible', clipEnabled);
            btnClip.classList.toggle('active', clipEnabled);
            if (clipEnabled) updateClipSliderRange();
            syncAnchorFromPlane();
            updateClipMaterials();
        }

        btnClip.addEventListener('click', toggleClipPanel);

        // Axis buttons
        clipPanelEl.querySelectorAll('.clip-axis-buttons button').forEach(btn => {
            btn.addEventListener('click', () => {
                setClipAxis(btn.dataset.axis);
            });
        });

        // Normal inputs
        function applyNormalInputs() {
            const x = parseFloat(clipNxInput.value) || 0;
            const y = parseFloat(clipNyInput.value) || 0;
            const z = parseFloat(clipNzInput.value) || 0;
            if (x === 0 && y === 0 && z === 0) return;  // skip zero vector
            clipPlane.normal.set(x, y, z).normalize();
            updatePlaneConstants();
            syncAnchorFromPlane();
            updateClipSliderRange();
            updateClipMaterials();
            // Clear axis highlight (custom normal)
            clipAxis = null;
            clipPanelEl.querySelectorAll('.clip-axis-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        [clipNxInput, clipNyInput, clipNzInput].forEach(input => {
            input.addEventListener('change', applyNormalInputs);
            // Prevent keyboard shortcuts from firing while typing
            input.addEventListener('keydown', (e) => e.stopPropagation());
        });

        // Distance slider
        clipDistanceSlider.addEventListener('input', () => {
            setClipDistance(parseFloat(clipDistanceSlider.value));
        });
        // Mouse wheel on slider for fine control
        clipDistanceSlider.addEventListener('wheel', (e) => {
            e.preventDefault();
            const step = e.shiftKey ? 0.1 : 0.01;
            const delta = e.deltaY > 0 ? -step : step;
            const newVal = Math.max(-20, Math.min(20, parseFloat(clipDistanceSlider.value) + delta));
            setClipDistance(newVal);
        });

        // Slab mode toggles
        document.getElementById('clip-mode-single').addEventListener('click', (e) => {
            clipSlabMode = false;
            e.currentTarget.classList.add('active');
            document.getElementById('clip-mode-slab').classList.remove('active');
            document.getElementById('clip-thickness-section').style.display = 'none';
            clipPlanes = [clipPlane];
            updatePlaneConstants();
            syncAnchorFromPlane();
            updateClipMaterials();
        });
        document.getElementById('clip-mode-slab').addEventListener('click', (e) => {
            clipSlabMode = true;
            e.currentTarget.classList.add('active');
            document.getElementById('clip-mode-single').classList.remove('active');
            document.getElementById('clip-thickness-section').style.display = '';
            clipPlanes = [clipPlane, clipPlane2];
            updatePlaneConstants();
            syncAnchorFromPlane();
            updateClipMaterials();
        });

        // Thickness slider (slab mode)
        clipThicknessSlider.addEventListener('input', () => {
            setClipThickness(parseFloat(clipThicknessSlider.value));
        });
        clipThicknessSlider.addEventListener('wheel', (e) => {
            e.preventDefault();
            const step = e.shiftKey ? 0.1 : 0.01;
            const delta = e.deltaY > 0 ? -step : step;
            setClipThickness(clipSlabThickness + delta);
        });

        // Close button
        document.getElementById('clip-close').addEventListener('click', toggleClipPanel);

        // Object registry
        const objects = new Map();
        const mixers = new Map();   // AnimationMixers keyed by object id

        // ========== Asset Loading Tracking ==========
        // Counts in-flight HTTP blob fetches. The server sends
        // mark_assets_complete once all asset messages have been dispatched;
        // the browser replies with assets_loaded only after both that flag is
        // set AND all pending fetches have finished.
        let pendingFetches = 0;
        let assetsComplete = false;

        function maybeNotifyAssetsLoaded() {
            if (pendingFetches === 0 && assetsComplete && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'assets_loaded' }));
            }
        }

        function onFetchStart() { pendingFetches++; }
        function onFetchEnd() {
            pendingFetches--;
            maybeNotifyAssetsLoaded();
        }

        // ========== Animation State ==========
        let animation = null;
        let animationPlaying = false;
        let animationTime = 0;
        let animationSpeed = 1;
        let animationLoop = true;
        let lastAnimationUpdate = 0;
        let baselineVisibility = new Map();  // Stores visibility state before animation

        const animControlsEl = document.getElementById('animation-controls');
        const timelineProgressEl = document.getElementById('timeline-progress');
        const timelineMarkersEl = document.getElementById('timeline-markers');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const currentFrameEl = document.getElementById('current-frame');
        const totalFramesEl = document.getElementById('total-frames');
        const btnPlay = document.getElementById('btn-play');
        const btnLoop = document.getElementById('btn-loop');

        function loadAnimation(animData) {
            animation = animData;
            animationTime = 0;
            animationPlaying = false;
            lastAnimationUpdate = performance.now();

            // Pre-build object reference arrays for each binary channel
            if (animation.channels) {
                for (const [name, ch] of Object.entries(animation.channels)) {
                    ch.refs = ch.ids.map(id => {
                        const obj = objects.get(id);
                        if (obj && name === 'transforms') obj.matrixAutoUpdate = false;
                        return obj || null;
                    });
                }
            }

            // Pre-compute frame time step for O(1) frame lookup (assumes uniform FPS)
            if (animation.frames.length >= 2) {
                const dt = animation.frames[1].time - animation.frames[0].time;
                animation.uniformDt = dt > 0 ? dt : 0;
            }

            // Store baseline visibility for all objects before animation starts
            baselineVisibility.clear();
            for (const [id, obj] of objects) {
                baselineVisibility.set(id, obj.visible);
            }

            // Update UI
            animControlsEl.classList.add('visible');
            totalTimeEl.textContent = animation.duration.toFixed(2);
            totalFramesEl.textContent = animation.frames.length;
            animationLoop = animation.loop;
            btnLoop.classList.toggle('active', animationLoop);
            updateAnimationUI();

            // Add markers
            timelineMarkersEl.innerHTML = '';
            if (animation.markers) {
                for (const marker of animation.markers) {
                    const el = document.createElement('div');
                    el.className = 'timeline-marker';
                    el.style.left = `${(marker.time / animation.duration) * 100}%`;
                    el.setAttribute('data-label', marker.label);
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        seekToTime(marker.time);
                    });
                    timelineMarkersEl.appendChild(el);
                }
            }

            // Apply first frame and start playing
            applyFrame(0);
            animationPlaying = true;
            lastAnimationUpdate = performance.now();
            console.log(`Animation loaded: ${animation.frames.length} frames, ${animation.duration.toFixed(2)}s`);
        }

        function stopAnimation() {
            // Restore matrixAutoUpdate on all objects
            objects.forEach((obj) => { obj.matrixAutoUpdate = true; });
            // Restore baseline visibility when stopping
            for (const [id, baselineVisible] of baselineVisibility) {
                const obj = objects.get(id);
                if (obj) {
                    obj.visible = baselineVisible;
                }
            }
            baselineVisibility.clear();
            animation = null;
            animationPlaying = false;
            animControlsEl.classList.remove('visible');
        }

        // Channel apply functions — keyed by channel name
        const CHANNEL_APPLY = {
            transforms(ch, refs, base) {
                const nObj = ch.ids.length;
                for (let i = 0; i < nObj; i++) {
                    let obj = refs[i];
                    if (!obj) {
                        obj = objects.get(ch.ids[i]);
                        if (obj) { refs[i] = obj; obj.matrixAutoUpdate = false; }
                    }
                    if (obj) {
                        obj.matrix.fromArray(ch.data, base + i * 16);
                        obj.matrixWorldNeedsUpdate = true;
                    }
                }
            },

            colors(ch, refs, base) {
                const nObj = ch.ids.length;
                const colormap = ch.colormap;
                for (let i = 0; i < nObj; i++) {
                    const raw = ch.data[base + i];
                    const color = colormap ? colormap[raw] : raw;
                    let obj = refs[i];
                    if (!obj) { obj = objects.get(ch.ids[i]); if (obj) refs[i] = obj; }
                    if (obj) {
                        obj.traverse(child => {
                            if (child.material) child.material.color.setHex(color);
                        });
                    }
                }
            },

            visibility(ch, refs, base) {
                const nObj = ch.ids.length;
                for (let i = 0; i < nObj; i++) {
                    let obj = refs[i];
                    if (!obj) { obj = objects.get(ch.ids[i]); if (obj) refs[i] = obj; }
                    if (obj) obj.visible = (ch.data[base + i] === 1);
                }
            },

            draw_ranges(ch, refs, base) {
                const nObj = ch.ids.length;
                for (let i = 0; i < nObj; i++) {
                    setDrawRange(ch.ids[i], ch.data[base + i]);
                }
            },

            opacity(ch, refs, base) {
                const nObj = ch.ids.length;
                for (let i = 0; i < nObj; i++) {
                    const val = ch.data[base + i];
                    let obj = refs[i];
                    if (!obj) { obj = objects.get(ch.ids[i]); if (obj) refs[i] = obj; }
                    if (obj) applyOpacity(obj, val);
                }
            },

            clip_times(ch, refs, base) {
                const nObj = ch.ids.length;
                for (let i = 0; i < nObj; i++) {
                    setClipTime(ch.ids[i], ch.data[base + i]);
                }
            },
        };

        function applyFrame(frameIndex) {
            if (!animation || frameIndex < 0 || frameIndex >= animation.frames.length) return;

            const frame = animation.frames[frameIndex];

            // Apply binary channels
            if (animation.channels) {
                // Restore baseline visibility before applying visibility channel
                if (animation.channels.visibility) {
                    for (const [id, baselineVisible] of baselineVisibility) {
                        const obj = objects.get(id);
                        if (obj) obj.visible = baselineVisible;
                    }
                }

                for (const [name, ch] of Object.entries(animation.channels)) {
                    const applyFn = CHANNEL_APPLY[name];
                    if (applyFn) {
                        const nObj = ch.ids.length;
                        const base = frameIndex * nObj * ch.stride;
                        applyFn(ch, ch.refs, base);
                    }
                }
            }

            // Apply JSON-based frame channels (sparse per-frame metadata).
            // No overlap with binary channels: the Python side filters frames_meta
            // to exclude fields that have a binary channel (see binary_channel_names).
            if (frame.transforms) {
                for (const [id, matrix] of Object.entries(frame.transforms)) {
                    const obj = objects.get(id);
                    if (obj) {
                        obj.matrixAutoUpdate = false;
                        obj.matrix.fromArray(matrix);
                        obj.matrixWorldNeedsUpdate = true;
                    }
                }
            }

            if (frame.colors) {
                for (const [id, color] of Object.entries(frame.colors)) {
                    const obj = objects.get(id);
                    if (obj) {
                        obj.traverse((child) => {
                            if (child.material) child.material.color.setHex(color);
                        });
                    }
                }
            }

            // Restore baseline visibility for JSON-based visibility (when no binary visibility channel)
            if (!animation.channels || !animation.channels.visibility) {
                for (const [id, baselineVisible] of baselineVisibility) {
                    const obj = objects.get(id);
                    if (obj) obj.visible = baselineVisible;
                }
            }
            if (frame.visibility) {
                for (const [id, visible] of Object.entries(frame.visibility)) {
                    const obj = objects.get(id);
                    if (obj) obj.visible = visible;
                }
            }

            if (frame.opacity) {
                for (const [id, opacity] of Object.entries(frame.opacity)) {
                    const obj = objects.get(id);
                    if (obj) applyOpacity(obj, opacity);
                }
            }

            if (frame.clip_times) {
                for (const [id, time] of Object.entries(frame.clip_times)) {
                    setClipTime(id, time);
                }
            }

            if (frame.draw_ranges) {
                for (const [id, value] of Object.entries(frame.draw_ranges)) {
                    setDrawRange(id, value);
                }
            }
        }

        function getFrameAtTime(time) {
            if (!animation || animation.frames.length === 0) return 0;
            // O(1) for uniform FPS (common case)
            if (animation.uniformDt > 0) {
                const idx = Math.floor(time / animation.uniformDt);
                return Math.max(0, Math.min(animation.frames.length - 1, idx));
            }
            // Fallback: linear scan for non-uniform frame times
            for (let i = animation.frames.length - 1; i >= 0; i--) {
                if (animation.frames[i].time <= time) {
                    return i;
                }
            }
            return 0;
        }

        function updateAnimationUI() {
            if (!animation) return;

            const frameIndex = getFrameAtTime(animationTime);
            const progress = animation.duration > 0 ? (animationTime / animation.duration) * 100 : 0;

            timelineProgressEl.style.width = `${progress}%`;
            currentTimeEl.textContent = animationTime.toFixed(2);
            currentFrameEl.textContent = frameIndex + 1;
            btnPlay.textContent = animationPlaying ? '⏸' : '▶';

        }

        function stepFrames(delta) {
            if (!animation) return;
            const currentFrame = getFrameAtTime(animationTime);
            const newFrame = Math.max(0, Math.min(animation.frames.length - 1, currentFrame + delta));
            animationTime = animation.frames[newFrame].time;
            applyFrame(newFrame);
            updateAnimationUI();
        }

        function seekToTime(time) {
            if (!animation) return;
            animationTime = Math.max(0, Math.min(animation.duration, time));
            const frameIndex = getFrameAtTime(animationTime);
            applyFrame(frameIndex);
            updateAnimationUI();
        }

        function togglePlay() {
            animationPlaying = !animationPlaying;
            if (animationPlaying) {
                lastAnimationUpdate = performance.now();
            }
            updateAnimationUI();
        }

        // Logarithmic speed steps: 0.001x to 1000x
        const speedSteps = [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000];
        let speedIndex = 6;  // starts at 1x
        const speedDisplayEl = document.getElementById('speed-display');

        function setSpeed(speed) {
            animationSpeed = speed;
            speedDisplayEl.textContent = `${speed}x`;
        }

        function stepSpeed(delta) {
            speedIndex = Math.max(0, Math.min(speedSteps.length - 1, speedIndex + delta));
            setSpeed(speedSteps[speedIndex]);
        }

        // Animation controls event listeners
        document.getElementById('btn-start').addEventListener('click', () => seekToTime(0));
        document.getElementById('btn-end').addEventListener('click', () => seekToTime(animation?.duration || 0));
        document.getElementById('btn-prev-frame').addEventListener('click', () => stepFrames(-1));
        document.getElementById('btn-next-frame').addEventListener('click', () => stepFrames(1));
        btnPlay.addEventListener('click', togglePlay);
        btnLoop.addEventListener('click', () => {
            animationLoop = !animationLoop;
            btnLoop.classList.toggle('active', animationLoop);
        });

        document.getElementById('btn-slower').addEventListener('click', () => stepSpeed(-1));
        document.getElementById('btn-faster').addEventListener('click', () => stepSpeed(1));

        const timelineContainer = document.getElementById('timeline-container');
        let scrubbing = false;
        let wasPlayingBeforeScrub = false;

        function scrubFromEvent(e) {
            if (!animation) return;
            const rect = timelineContainer.getBoundingClientRect();
            const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const ratio = x / rect.width;
            seekToTime(ratio * animation.duration);
        }

        timelineContainer.addEventListener('mousedown', (e) => {
            if (!animation) return;
            scrubbing = true;
            wasPlayingBeforeScrub = animationPlaying;
            animationPlaying = false;
            scrubFromEvent(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (scrubbing) scrubFromEvent(e);
        });

        document.addEventListener('mouseup', () => {
            if (scrubbing) {
                scrubbing = false;
                if (wasPlayingBeforeScrub) {
                    animationPlaying = true;
                    lastAnimationUpdate = performance.now();
                }
                updateAnimationUI();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Skip shortcuts when typing in an input field
            if (e.target.tagName === 'INPUT') return;
            // Global shortcuts (work even without animation)
            if (e.code === 'KeyO' && !e.ctrlKey && !e.metaKey) {
                switchCamera(!isOrtho);
                return;
            }
            if (e.code === 'KeyC' && !e.ctrlKey && !e.metaKey) {
                toggleClipPanel();
                return;
            }

            // Clipping plane shortcuts (when panel is open)
            if (clipEnabled) {
                if (e.code === 'KeyV') {
                    // Snap ortho camera to look along clip plane normal
                    const center = clipPlane.normal.clone().multiplyScalar(clipPosition);
                    controls.target.copy(center);
                    const camDist = 50;
                    const camPos = center.clone().addScaledVector(clipPlane.normal, camDist);
                    if (!isOrtho) switchCamera(true);
                    camera.position.copy(camPos);
                    camera.lookAt(center);
                    camera.zoom = 1;
                    camera.updateProjectionMatrix();
                    controls.update();
                    return;
                }
                if (e.code === 'KeyS') {
                    if (clipSlabMode) {
                        document.getElementById('clip-mode-single').click();
                    } else {
                        document.getElementById('clip-mode-slab').click();
                    }
                    return;
                }
                if (e.code === 'KeyH') {
                    clipHelperVisible = !clipHelperVisible;
                    clipPanelEl.classList.toggle('visible', clipHelperVisible);
                    updateClipMaterials();
                    return;
                }
                // Arrow keys: clipping takes precedence over animation
                {
                    const step = e.shiftKey ? 0.5 : 0.05;
                    switch (e.code) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            setClipDistance(clipPosition - step);
                            return;
                        case 'ArrowRight':
                            e.preventDefault();
                            setClipDistance(clipPosition + step);
                            return;
                        case 'ArrowUp':
                            if (clipSlabMode) {
                                e.preventDefault();
                                setClipThickness(clipSlabThickness + step);
                                return;
                            }
                            break;
                        case 'ArrowDown':
                            if (clipSlabMode) {
                                e.preventDefault();
                                setClipThickness(clipSlabThickness - step);
                                return;
                            }
                            break;
                    }
                }
            }

            if (!animation) return;

            switch (e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    stepFrames(e.shiftKey ? -10 : -1);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    stepFrames(e.shiftKey ? 10 : 1);
                    break;
                case 'Home':
                    e.preventDefault();
                    seekToTime(0);
                    break;
                case 'End':
                    e.preventDefault();
                    seekToTime(animation.duration);
                    break;
                case 'KeyL':
                    animationLoop = !animationLoop;
                    btnLoop.classList.toggle('active', animationLoop);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    stepSpeed(1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    stepSpeed(-1);
                    break;
            }
        });

        // Loaders
        const loaders = {
            obj: new OBJLoader(),
            gltf: new GLTFLoader(),
            glb: new GLTFLoader(),
            fbx: new FBXLoader(),
            dae: new ColladaLoader(),
            stl: new STLLoader(),
            ply: new PLYLoader(),
            '3ds': new TDSLoader()
        };

        // Primitive creators
        const primitives = {
            box: (params) => new THREE.BoxGeometry(
                params.width || 1, params.height || 1, params.depth || 1
            ),
            sphere: (params) => new THREE.SphereGeometry(
                params.radius || 0.5, params.widthSegments || 32, params.heightSegments || 16
            ),
            cylinder: (params) => new THREE.CylinderGeometry(
                params.radiusTop || 0.5, params.radiusBottom || 0.5,
                params.height || 1, params.radialSegments || 32
            ),
            plane: (params) => new THREE.PlaneGeometry(
                params.width || 1, params.height || 1
            ),
            cone: (params) => new THREE.ConeGeometry(
                params.radius || 0.5, params.height || 1, params.radialSegments || 32
            ),
            torus: (params) => new THREE.TorusGeometry(
                params.radius || 0.5, params.tube || 0.2,
                params.radialSegments || 16, params.tubularSegments || 48
            ),
            capsule: (params) => new THREE.CapsuleGeometry(
                params.radius || 0.25, params.length || 0.5,
                params.capSegments || 8, params.radialSegments || 16
            )
        };

        // Apply transform to object
        function applyTransform(obj, transform) {
            if (!transform) return;

            if (transform.matrix) {
                const m = new THREE.Matrix4();
                m.fromArray(transform.matrix);
                obj.matrix.copy(m);
                obj.matrix.decompose(obj.position, obj.quaternion, obj.scale);
            } else {
                if (transform.position) {
                    obj.position.fromArray(transform.position);
                }
                if (transform.rotation) {
                    obj.rotation.fromArray(transform.rotation);
                }
                if (transform.quaternion) {
                    obj.quaternion.fromArray(transform.quaternion);
                }
                if (transform.scale) {
                    obj.scale.fromArray(transform.scale);
                }
            }
        }

        // Create material from params
        function createMaterial(params) {
            const color = params.color || 0x4a90d9;
            const materialType = params.materialType || 'standard';
            const opacity = params.opacity != null ? params.opacity : 1;
            const transparent = opacity < 1;
            const clip = clipEnabled ? clipPlanes : [];

            switch (materialType) {
                case 'basic':
                    return new THREE.MeshBasicMaterial({ color, opacity, transparent, clippingPlanes: clip });
                case 'phong':
                    return new THREE.MeshPhongMaterial({ color, opacity, transparent, clippingPlanes: clip });
                case 'lambert':
                    return new THREE.MeshLambertMaterial({ color, opacity, transparent, clippingPlanes: clip });
                default:
                    const roughness = params.roughness != null ? params.roughness : 0.7;
                    const metalness = params.metalness != null ? params.metalness : 0.3;
                    return new THREE.MeshStandardMaterial({ color, roughness, metalness, opacity, transparent, clippingPlanes: clip });
            }
        }

        // Set opacity on all materials of an object (handles GLB PBR materials)
        function setOpacity(id, opacity) {
            const obj = objects.get(id);
            if (!obj) return;
            applyOpacity(obj, opacity);
        }

        function applyOpacity(obj, opacity) {
            obj.traverse(child => {
                if (!child.material) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const mat of mats) {
                    const wasTransparent = mat.transparent;
                    mat.transparent = opacity < 1;
                    mat.opacity = opacity;
                    mat.depthWrite = opacity >= 1;
                    // Three.js requires needsUpdate when transparent flag changes
                    if (mat.transparent !== wasTransparent) mat.needsUpdate = true;
                }
            });
        }

        // Add object to parent or scene
        function addToParentOrScene(obj, parentId) {
            if (parentId) {
                const parent = objects.get(parentId);
                if (parent) {
                    parent.add(obj);
                } else {
                    console.warn(`Parent '${parentId}' not found, adding to scene`);
                    scene.add(obj);
                }
            } else {
                scene.add(obj);
            }
        }

        // Add object to scene
        async function addObject(id, objData, parentId) {
            let obj;

            if (objData.primitive) {
                const geometry = primitives[objData.primitive](objData.params || {});
                const material = createMaterial(objData.params || {});
                obj = new THREE.Mesh(geometry, material);
            } else if (objData.model) {
                const format = objData.format || 'gltf';
                const loader = loaders[format];

                if (!loader) {
                    console.error(`Unknown format: ${format}`);
                    return;
                }

                try {
                    const result = await loadModel(loader, objData.model, format, objData.yUp === true);
                    obj = result.obj;
                    if (result.animations.length > 0) {
                        // Root the mixer at the GLTF scene so animation tracks
                        // can resolve their target nodes by name within the
                        // Y-up→Z-up correction wrapper.
                        const mixerRoot = obj.userData.gltfScene || obj;
                        const mixer = new THREE.AnimationMixer(mixerRoot);
                        for (const clip of result.animations) {
                            const action = mixer.clipAction(clip);
                            action.play();
                        }
                        // Seek to time 0 to apply initial pose
                        mixer.setTime(0);
                        mixers.set(id, mixer);
                        console.log(`Model ${id}: ${result.animations.length} animation clip(s) available`);
                    }
                } catch (e) {
                    console.error(`Failed to load model: ${e}`);
                    return;
                }
            }

            if (obj) {
                obj.name = id;
                obj.userData.id = id;
                applyTransform(obj, objData.transform);

                if (objData.visible === false) {
                    obj.visible = false;
                }

                addToParentOrScene(obj, parentId);
                objects.set(id, obj);
                if (clipEnabled) applyClipToObject(obj);
            }
        }

        // Load model helper
        function loadModel(loader, url, format, yUp) {
            return new Promise((resolve, reject) => {
                loader.load(
                    url,
                    (result) => {
                        let obj;
                        let animations = [];
                        if (format === 'gltf' || format === 'glb') {
                            if (yUp) {
                                // Model uses Y-up (glTF spec default); wrap in a
                                // correction group to stand it upright in Z-up viewer.
                                // The outer container is user-controlled (set_matrix
                                // targets it); the inner correction is permanent.
                                const correction = new THREE.Group();
                                correction.rotation.x = Math.PI / 2;
                                correction.add(result.scene);
                                obj = new THREE.Group();
                                obj.add(correction);
                                // Store the GLTF scene root so the AnimationMixer can
                                // resolve track targets by name inside the hierarchy.
                                obj.userData.gltfScene = result.scene;
                            } else {
                                // Model is already Z-up (e.g. CAD export); no correction.
                                obj = new THREE.Group();
                                obj.add(result.scene);
                                obj.userData.gltfScene = result.scene;
                            }
                            animations = result.animations || [];
                        } else if (format === 'dae') {
                            // Create a clean group with only meshes (no lights/cameras from DAE)
                            obj = new THREE.Group();
                            result.scene.traverse((child) => {
                                if (child.isMesh) {
                                    obj.add(child.clone());
                                }
                            });
                        } else if (format === 'stl' || format === 'ply') {
                            const material = new THREE.MeshStandardMaterial({ color: 0x4a90d9 });
                            obj = new THREE.Mesh(result, material);
                        } else {
                            obj = result;
                        }
                        resolve({ obj, animations });
                    },
                    undefined,
                    reject
                );
            });
        }

        // Seek a model's embedded animation clips to a specific time
        function setClipTime(id, time) {
            const mixer = mixers.get(id);
            if (!mixer) return;
            mixer.setTime(time);
        }

        // Set draw range (fraction visible) for polylines and meshes
        function setDrawRange(id, value) {
            const obj = objects.get(id);
            if (!obj) return;
            if (obj.userData.isPolyline) {
                obj.geometry.instanceCount = Math.round(value * obj.userData.maxInstanceCount);
            } else if (obj.userData.isMesh) {
                obj.geometry.setDrawRange(0, Math.round(value * obj.userData.totalIndexCount));
            }
        }

        // Update object transform
        function updateTransform(id, transform) {
            const obj = objects.get(id);
            if (obj) {
                applyTransform(obj, transform);
            }
        }

        // Delete object (and recursively remove children from registry)
        function deleteObject(id) {
            const obj = objects.get(id);
            if (obj) {
                // Collect all registered child IDs before removal
                const childIds = [];
                obj.traverse((child) => {
                    if (child !== obj && child.userData.id) {
                        childIds.push(child.userData.id);
                    }
                });
                // Remove children from registry and clean up their mixers
                for (const childId of childIds) {
                    objects.delete(childId);
                    const childMixer = mixers.get(childId);
                    if (childMixer) {
                        childMixer.stopAllAction();
                        mixers.delete(childId);
                    }
                }
                // Remove from parent (scene or group)
                if (obj.parent) {
                    obj.parent.remove(obj);
                }
                objects.delete(id);
                // Clean up animation mixer/clips
                const mixer = mixers.get(id);
                if (mixer) {
                    mixer.stopAllAction();
                    mixers.delete(id);
                }
                // Clean up blob URLs and dispose geometry/materials
                obj.traverse((child) => {
                    if (child.userData.blobUrl) {
                        URL.revokeObjectURL(child.userData.blobUrl);
                    }
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
            }
        }

        // Set visibility
        function setVisibility(id, visible) {
            const obj = objects.get(id);
            if (obj) {
                obj.visible = visible;
            }
        }

        // Clear scene
        function clearScene() {
            for (const id of objects.keys()) {
                deleteObject(id);
            }
        }

        // Batch update transforms + optional opacity (for 60fps updates)
        function batchUpdate(transforms) {
            for (const [id, transform] of Object.entries(transforms)) {
                updateTransform(id, transform);
                if (transform.opacity != null) {
                    setOpacity(id, transform.opacity);
                }
            }
        }

        // WebSocket connection - connects directly to Python client
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        let ws = null;
        let reconnectTimeout = null;
        const urlParams = new URLSearchParams(window.location.search);
        const WS_PORT = parseInt(urlParams.get('ws_port')) || 5666;

        async function connect() {
            // Probe with fetch first to avoid browser-level WebSocket error spam
            try {
                await fetch(`http://localhost:${WS_PORT}`, { mode: 'no-cors' });
            } catch {
                reconnectTimeout = setTimeout(connect, 1000);
                return;
            }
            ws = new WebSocket(`ws://localhost:${WS_PORT}`);

            ws.onopen = () => {
                statusDot.className = 'connected';
                statusDot.title = 'Connected';
                statusText.textContent = 'Connected';
                // Reset asset-tracking state for this connection
                pendingFetches = 0;
                assetsComplete = false;
                ws.send(JSON.stringify({ type: 'hello', viewer_version: VIEWER_VERSION }));
            };

            ws.onclose = () => {
                statusDot.className = 'disconnected';
                statusDot.title = 'Waiting for Python...';
                statusText.textContent = 'Waiting...';
                reconnectTimeout = setTimeout(connect, 500);
            };

            ws.onerror = () => {};

            ws.onmessage = async (event) => {
                const tParse = performance.now();
                const data = JSON.parse(event.data);
                const parseMs = performance.now() - tParse;
                if (parseMs > 200) {
                    console.warn(
                        `JSON.parse took ${parseMs.toFixed(0)}ms (${(event.data.length / 1024 / 1024).toFixed(1)}MB). ` +
                        `Consider using binary channels (animation.add_channel()) for large animation data.`
                    );
                }

                switch (data.type) {
                    case 'hello':
                        console.log(`Python client v${data.client_version}`);
                        if (data.client_version !== VIEWER_VERSION) {
                            console.warn(
                                `Version mismatch: viewer v${VIEWER_VERSION}, client v${data.client_version}. ` +
                                `Close this tab and re-open viewer.html to pick up the latest version.`
                            );
                        }
                        break;
                    case 'add_group': {
                        const group = new THREE.Group();
                        group.name = data.id;
                        group.userData.id = data.id;
                        if (data.transform) applyTransform(group, data.transform);
                        if (data.visible === false) group.visible = false;
                        addToParentOrScene(group, data.parent);
                        objects.set(data.id, group);
                        break;
                    }
                    case 'add_object':
                        await addObject(data.id, data.object, data.parent);
                        break;
                    case 'update_transform':
                        updateTransform(data.id, data.transform);
                        break;
                    case 'delete_object':
                        deleteObject(data.id);
                        break;
                    case 'set_visibility':
                        setVisibility(data.id, data.visible);
                        break;
                    case 'clear_scene':
                        clearScene();
                        break;
                    case 'batch_update':
                        batchUpdate(data.transforms);
                        break;
                    case 'set_color':
                        const colorObj = objects.get(data.id);
                        if (colorObj) {
                            colorObj.traverse((child) => {
                                if (child.material) {
                                    child.material.color.setHex(data.color);
                                }
                            });
                            if (data.opacity != null) applyOpacity(colorObj, data.opacity);
                        }
                        break;
                    case 'set_opacity':
                        setOpacity(data.id, data.opacity);
                        break;
                    case 'list_objects':
                        ws.send(JSON.stringify({
                            type: 'list_objects_response',
                            requestId: data.requestId,
                            objects: Array.from(objects.keys())
                        }));
                        break;
                    case 'query_scene': {
                        const tree = {};
                        for (const [id, obj] of objects) {
                            tree[id] = {
                                type: obj.type,
                                parent: obj.parent?.userData?.id || null,
                                children: obj.children
                                    .filter(c => c.userData?.id)
                                    .map(c => c.userData.id),
                                visible: obj.visible,
                            };
                        }
                        ws.send(JSON.stringify({
                            type: 'query_scene_response',
                            requestId: data.requestId,
                            tree: tree,
                        }));
                        break;
                    }
                    case 'load_animation':
                        loadAnimation(data.animation);
                        break;
                    case 'load_animation_http':
                        onFetchStart();
                        (async () => {
                            try {
                                const t0 = performance.now();
                                const resp = await fetch(data.blob_url);
                                const buffer = await resp.arrayBuffer();
                                const t1 = performance.now();
                                console.log(`HTTP animation fetch: ${(buffer.byteLength / 1024 / 1024).toFixed(1)}MB in ${(t1 - t0).toFixed(0)}ms`);

                                const nFrames = data.frame_count;

                                // Parse generic binary channels from manifest
                                const DTYPE_INFO = {
                                    float32: { ArrayType: Float32Array, bytes: 4 },
                                    uint32:  { ArrayType: Uint32Array,  bytes: 4 },
                                    uint8:   { ArrayType: Uint8Array,   bytes: 1 },
                                };

                                let byteOffset = 0;
                                const channels = {};
                                if (data.channels) {
                                    for (const ch of data.channels) {
                                        const info = DTYPE_INFO[ch.dtype];
                                        if (!info) { console.error(`Unknown channel dtype '${ch.dtype}' for '${ch.name}', skipping`); continue; }
                                        const count = nFrames * ch.ids.length * ch.stride;
                                        channels[ch.name] = {
                                            data: new info.ArrayType(buffer, byteOffset, count),
                                            ids: ch.ids,
                                            stride: ch.stride,
                                            refs: null,
                                            colormap: ch.colormap || null,
                                        };
                                        byteOffset += count * info.bytes;
                                    }
                                }

                                // Build sparse frames from frames_meta
                                const tMeta = performance.now();
                                const metaByFrame = {};
                                if (data.frames_meta) {
                                    for (const meta of data.frames_meta) {
                                        metaByFrame[meta.index] = meta;
                                    }
                                }

                                const frames = [];
                                for (let fi = 0; fi < nFrames; fi++) {
                                    const frame = { time: data.frame_times[fi] };
                                    const meta = metaByFrame[fi];
                                    if (meta) {
                                        if (meta.colors) frame.colors = meta.colors;
                                        if (meta.visibility) frame.visibility = meta.visibility;
                                        if (meta.opacity) frame.opacity = meta.opacity;
                                        if (meta.clip_times) frame.clip_times = meta.clip_times;
                                        if (meta.draw_ranges) frame.draw_ranges = meta.draw_ranges;
                                    }
                                    frames.push(frame);
                                }

                                const metaMs = performance.now() - tMeta;
                                if (metaMs > 500) {
                                    console.warn(
                                        `frames_meta processing took ${metaMs.toFixed(0)}ms. ` +
                                        `Consider using animation.add_channel() on the Python side ` +
                                        `for colors/visibility/opacity/draw_ranges for much faster transfer.`
                                    );
                                }

                                loadAnimation({
                                    duration: data.duration,
                                    fps: data.fps,
                                    loop: data.loop,
                                    frames: frames,
                                    markers: data.markers || [],
                                    channels: channels,
                                });
                                console.log(`  total: ${(performance.now() - t0).toFixed(0)}ms`);
                            } catch (e) {
                                console.error('Error loading animation via HTTP:', e);
                            } finally {
                                onFetchEnd();
                            }
                        })();
                        break;
                    case 'add_model_binary':
                        onFetchStart();
                        (async () => {
                            try {
                                const resp = await fetch(data.blob_url);
                                const meshBytes = await resp.arrayBuffer();
                                const blob = new Blob([meshBytes]);
                                const blobUrl = URL.createObjectURL(blob);
                                console.log(`Loading model ${data.id} (${data.format}) via HTTP`);
                                await addObject(data.id, {
                                    model: blobUrl,
                                    format: data.format || 'stl',
                                    yUp: data.yUp === true,
                                }, data.parent);
                                const obj = objects.get(data.id);
                                if (obj) {
                                    obj.userData.blobUrl = blobUrl;
                                    if (data.transform) updateTransform(data.id, data.transform);
                                }
                            } catch (e) {
                                console.error(`Error loading model via HTTP:`, e);
                            } finally {
                                onFetchEnd();
                            }
                        })();
                        break;
                    case 'add_polyline_binary':
                        onFetchStart();
                        (async () => {
                            try {
                                const resp = await fetch(data.blob_url);
                                const buffer = await resp.arrayBuffer();
                                const rawData = new Uint8Array(buffer);
                                const numPoints = data.numPoints || (rawData.length / 12);
                                const positionBytes = numPoints * 12;

                                const posBuffer = new ArrayBuffer(positionBytes);
                                new Uint8Array(posBuffer).set(rawData.slice(0, positionBytes));
                                const pointData = new Float32Array(posBuffer);

                                console.log(`Creating polyline ${data.id} with ${numPoints} points via HTTP`);

                                const geometry = new LineGeometry();
                                geometry.setPositions(pointData);

                                let material;
                                if (data.hasVertexColors) {
                                    const colorBytes = rawData.slice(positionBytes);
                                    const colorData = new Float32Array(numPoints * 3);
                                    for (let i = 0; i < numPoints; i++) {
                                        colorData[i * 3] = colorBytes[i * 3] / 255;
                                        colorData[i * 3 + 1] = colorBytes[i * 3 + 1] / 255;
                                        colorData[i * 3 + 2] = colorBytes[i * 3 + 2] / 255;
                                    }
                                    geometry.setColors(colorData);

                                    material = new LineMaterial({
                                        color: 0xffffff,
                                        vertexColors: true,
                                        linewidth: data.lineWidth || 2,
                                        resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
                                    });
                                } else {
                                    material = new LineMaterial({
                                        color: data.color || 0xffffff,
                                        linewidth: data.lineWidth || 2,
                                        resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
                                    });
                                }

                                const line = new Line2(geometry, material);
                                line.computeLineDistances();
                                line.name = data.id;
                                line.userData.id = data.id;
                                line.userData.isPolyline = true;
                                line.userData.maxInstanceCount = numPoints - 1;
                                addToParentOrScene(line, data.parent);
                                objects.set(data.id, line);
                            } catch (e) {
                                console.error(`Error creating polyline via HTTP:`, e);
                            } finally {
                                onFetchEnd();
                            }
                        })();
                        break;
                    case 'add_mesh_binary':
                        onFetchStart();
                        (async () => {
                            try {
                                const resp = await fetch(data.blob_url);
                                const buffer = await resp.arrayBuffer();
                                const nv = data.numVertices;
                                const ni = data.numIndices;

                                let offset = 0;
                                const positions = new Float32Array(buffer, offset, nv * 3);
                                offset += nv * 3 * 4;

                                let normals = null;
                                if (data.hasNormals) {
                                    normals = new Float32Array(buffer, offset, nv * 3);
                                    offset += nv * 3 * 4;
                                }

                                let colors = null;
                                if (data.hasVertexColors) {
                                    colors = new Float32Array(buffer, offset, nv * 3);
                                    offset += nv * 3 * 4;
                                }

                                const indices = new Uint32Array(buffer, offset, ni);

                                const geometry = new THREE.BufferGeometry();
                                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                                if (normals) {
                                    geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                                } else {
                                    geometry.computeVertexNormals();
                                }
                                if (colors) {
                                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                                }

                                const opacity = data.opacity !== undefined ? data.opacity : 1;
                                const material = new THREE.MeshStandardMaterial({
                                    color: colors ? 0xffffff : (data.color || 0x7ab8cc),
                                    metalness: data.metalness !== undefined ? data.metalness : 0.1,
                                    roughness: data.roughness !== undefined ? data.roughness : 0.8,
                                    opacity: opacity,
                                    transparent: opacity < 1,
                                    depthWrite: opacity >= 1,
                                    side: THREE.DoubleSide,
                                    vertexColors: !!colors,
                                    clippingPlanes: clipEnabled ? clipPlanes : [],
                                });

                                const mesh = new THREE.Mesh(geometry, material);
                                mesh.name = data.id;
                                mesh.userData.id = data.id;
                                mesh.userData.isMesh = true;
                                mesh.userData.totalIndexCount = ni;
                                addToParentOrScene(mesh, data.parent);
                                objects.set(data.id, mesh);
                                console.log(`Created mesh ${data.id}: ${nv} verts, ${(ni / 3)|0} tris`);
                            } catch (e) {
                                console.error(`Error creating mesh:`, e);
                            } finally {
                                onFetchEnd();
                            }
                        })();
                        break;
                    case 'stop_animation':
                        stopAnimation();
                        break;
                    case 'set_clip_time':
                        setClipTime(data.id, data.time);
                        break;
                    case 'set_draw_range':
                        setDrawRange(data.id, data.value);
                        break;
                    case 'set_clipping_plane': {
                        clipEnabled = true;
                        // Switch to single mode
                        clipSlabMode = false;
                        clipPlanes = [clipPlane];
                        document.getElementById('clip-mode-single').classList.add('active');
                        document.getElementById('clip-mode-slab').classList.remove('active');
                        document.getElementById('clip-thickness-section').style.display = 'none';
                        if (data.normal) {
                            clipPlane.normal.fromArray(data.normal).normalize();
                            syncNormalInputs();
                        }
                        if (data.distance != null) {
                            setClipDistance(data.distance);
                        }
                        if (data.show_helper != null) {
                            clipHelperVisible = data.show_helper;
                        }
                        // Sync UI: find matching axis
                        let matchedAxis = null;
                        for (const [axis, n] of Object.entries(CLIP_AXIS_NORMALS)) {
                            if (n.equals(clipPlane.normal)) { matchedAxis = axis; break; }
                        }
                        if (matchedAxis) setClipAxis(matchedAxis);
                        updateClipSliderRange();
                        syncAnchorFromPlane();
                        clipPanelEl.classList.add('visible');
                        btnClip.classList.add('active');
                        updateClipMaterials();
                        break;
                    }
                    case 'set_clipping_slab': {
                        clipEnabled = true;
                        // Switch to slab mode
                        clipSlabMode = true;
                        clipPlanes = [clipPlane, clipPlane2];
                        document.getElementById('clip-mode-slab').classList.add('active');
                        document.getElementById('clip-mode-single').classList.remove('active');
                        document.getElementById('clip-thickness-section').style.display = '';
                        if (data.normal) {
                            clipPlane.normal.fromArray(data.normal).normalize();
                            syncNormalInputs();
                        }
                        if (data.thickness != null) {
                            setClipThickness(data.thickness);
                        }
                        if (data.center != null) {
                            setClipDistance(data.center);
                        }
                        if (data.show_helper != null) {
                            clipHelperVisible = data.show_helper;
                        }
                        // Sync UI: find matching axis
                        let matchedAxis2 = null;
                        for (const [axis, n] of Object.entries(CLIP_AXIS_NORMALS)) {
                            if (n.equals(clipPlane.normal)) { matchedAxis2 = axis; break; }
                        }
                        if (matchedAxis2) setClipAxis(matchedAxis2);
                        updateClipSliderRange();
                        syncAnchorFromPlane();
                        clipPanelEl.classList.add('visible');
                        btnClip.classList.add('active');
                        updateClipMaterials();
                        break;
                    }
                    case 'disable_clipping_plane':
                        clipEnabled = false;
                        clipPanelEl.classList.remove('visible');
                        btnClip.classList.remove('active');
                        updateClipMaterials();
                        break;
                    case 'set_clipping_defaults':
                        clipDefaults = { normal: data.normal, distance: data.distance };
                        break;
                    case 'mark_assets_complete':
                        assetsComplete = true;
                        maybeNotifyAssetsLoaded();
                        break;
                }
            };
        }

        connect();

        // Window resize handler
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            perspCamera.aspect = aspect;
            perspCamera.updateProjectionMatrix();
            orthoCamera.left = -ORTHO_FRUSTUM * aspect;
            orthoCamera.right = ORTHO_FRUSTUM * aspect;
            orthoCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Update LineMaterial resolution for all polylines
            objects.forEach((obj) => {
                if (obj.material && obj.material.resolution) {
                    obj.material.resolution.set(window.innerWidth, window.innerHeight);
                }
            });
        });

        // Animation loop
        let lastUIUpdate = 0;
        let lastFrameTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const frameNow = performance.now();
            const frameDelta = (frameNow - lastFrameTime) / 1000;
            lastFrameTime = frameNow;

            // Update animation playback
            if (animation && animationPlaying) {
                const now = performance.now();
                const deltaTime = (now - lastAnimationUpdate) / 1000;
                lastAnimationUpdate = now;

                animationTime += deltaTime * animationSpeed;

                if (animationTime >= animation.duration) {
                    if (animationLoop) {
                        animationTime = animationTime % animation.duration;
                    } else {
                        animationTime = animation.duration;
                        animationPlaying = false;
                    }
                }

                const frameIndex = getFrameAtTime(animationTime);
                applyFrame(frameIndex);
                // Throttle UI updates to ~10fps (DOM updates are expensive)
                if (now - lastUIUpdate > 100) {
                    updateAnimationUI();
                    lastUIUpdate = now;
                }
            }

            controls.update();

            if (viewHelper.animating) viewHelper.update(frameDelta);
            renderer.autoClear = true;
            renderer.render(scene, camera);
            renderer.autoClear = false;
            viewHelper.render(renderer);
        }

        animate();
    </script>
</body>
